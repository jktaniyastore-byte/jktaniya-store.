<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JK TANIYA STORE</title>
  <meta name="description" content="Welcome to JK TANIYA STORE - Your premium online shopping destination.">

  <link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #f5c542;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      min-height: 420px;
      padding: 90px 8%;
      text-align: center;
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      animation: fadeIn 1.2s ease;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 55px);
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .shop-btn {
      display: inline-block;
      background: #f5c542;
      color: #111;
      padding: 14px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .categories {
      padding: 55px 6%;
      text-align: center;
    }

    .categories h2 {
      margin-bottom: 30px;
      font-size: 30px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .category {
      background: white;
      padding: 35px 15px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #00000010;
      transition: transform .3s;
    }

    .category:hover {
      transform: translateY(-8px);
    }

    .category h3 {
      color: #111827;
    }

    footer {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 600px) {
      header {
        justify-content: center;
      }
      nav a {
        margin: 5px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">JK TANIYA STORE</div>
    <nav>
      <a href="#">Home</a>
      <a href="#categories">Categories</a>
      <a href="#contact">Contact</a>
      <a href="#cart">Cart</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to JK TANIYA STORE</h1>
    <p>Discover Quality Products at Amazing Prices.</p>
    <a href="#categories" class="shop-btn">SHOP NOW</a>
  </section>

  <section class="categories" id="categories">
    <h2>Our Categories</h2>

    <div class="category-grid">
      <div class="category"><h3>Fashion</h3></div>
      <div class="category"><h3>Electronics</h3></div>
      <div class="category"><h3>Beauty</h3></div>
      <div class="category"><h3>Accessories</h3></div>
    </div>
  </section>

  <footer id="contact">
    <p>© 2026 JK TANIYA STORE. All Rights Reserved.</p>
  </footer>

</body>
</html>
